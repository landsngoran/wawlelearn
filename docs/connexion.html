<!DOCTYPE html>

<title>Connexion — WawléLearn</title>

<body>
<div class="container">
  <h1>WawléLearn 🇨🇮</h1>
  <h2>Se connecter</h2>
  <form id="form-connexion">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="120" autocomplete="email">

    <label for="motdepasse">Mot de passe</label>
    <input id="motdepasse" name="current-password" type="password" required maxlength="72" autocomplete="current-password">

    <button type="submit">Connexion</button>
    <p id="msg-connexion" class="msg" role="alert"></p>
  </form>
  <p>Pas encore de compte ? <a href="inscription.html">S'inscrire gratuitement</a></p>
  <p><a href="index.html">← Retour à l'accueil</a></p>
